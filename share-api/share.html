<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Password Entry · 安全分享</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #172033;
      --muted: #6d7890;
      --line: #e4e9f2;
      --surface: rgba(255, 255, 255, .88);
      --blue: #3b63d8;
      --blue-dark: #2949b8;
      --blue-soft: #eef3ff;
      --green: #20855a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, #e8efff 0, transparent 34%),
        radial-gradient(circle at 90% 94%, #e7f5f2 0, transparent 30%),
        #f6f8fc;
    }
    button { font: inherit; }
    .page { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 52px; }
    .brand { display: flex; align-items: center; gap: 12px; margin: 0 8px 26px; }
    .brand-mark {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
      color: white; background: linear-gradient(145deg, #5b7bea, #2d4fbe); box-shadow: 0 10px 22px #4265d633;
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: -.01em; }
    .brand-caption { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .card {
      overflow: hidden; border: 1px solid #fff; border-radius: 24px; background: var(--surface);
      box-shadow: 0 24px 70px rgba(44, 61, 96, .12), 0 3px 10px rgba(44, 61, 96, .05);
      backdrop-filter: blur(18px);
    }
    .card-head { padding: 28px 30px 24px; border-bottom: 1px solid var(--line); }
    .eyebrow { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: 0; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #35b777; box-shadow: 0 0 0 4px #35b7771c; }
    .item { display: flex; align-items: center; gap: 15px; margin-top: 20px; }
    .item-icon { display: grid; place-items: center; flex: 0 0 54px; width: 54px; height: 54px; border-radius: 17px; color: #3357c7; background: linear-gradient(145deg, #eef3ff, #dbe5ff); font-size: 22px; font-weight: 800; }
    .item-name { margin: 0; font-size: 23px; line-height: 1.2; letter-spacing: -.035em; }
    .item-domain { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .body { padding: 24px 30px 26px; }
    .section-label { margin: 25px 0 10px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .fields { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .field { display: flex; align-items: center; gap: 15px; min-height: 72px; padding: 13px 14px 13px 17px; }
    .field + .field { border-top: 1px solid var(--line); }
    .field-label { flex: 0 0 66px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .field-main { min-width: 0; flex: 1; }
    .field-value { display: block; overflow: hidden; color: var(--ink); font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .field-value.secret { letter-spacing: .16em; }
    .totp-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 21px; letter-spacing: .14em; }
    .field-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .field-actions { display: flex; align-items: center; gap: 7px; }
    .icon-button, .copy-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 9px;
      color: #52617b; background: #fff; cursor: pointer; transition: .18s ease;
    }
    .icon-button { width: 34px; height: 34px; padding: 0; }
    .copy-button { min-width: 58px; height: 34px; padding: 0 10px; font-size: 12px; font-weight: 700; }
    .icon-button:hover, .copy-button:hover { border-color: #bdcaff; color: var(--blue); background: var(--blue-soft); }
    .icon-button:focus-visible, .copy-button:focus-visible { outline: 3px solid #86a3ff66; outline-offset: 2px; }
    .footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .footer strong { color: #52617b; font-weight: 700; }
    .empty { padding: 38px 30px; text-align: center; }
    .empty-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 16px; color: #c45b5b; background: #fff0f0; }
    .empty h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .empty p { margin: 9px auto 0; max-width: 410px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      .page { width: min(100% - 20px, 680px); padding: 22px 0 30px; }
      .brand { margin: 0 5px 18px; }
      .card-head, .body { padding-left: 19px; padding-right: 19px; }
      .item-name { font-size: 20px; }
      .field { gap: 9px; padding-left: 13px; }
      .field-label { flex-basis: 52px; }
      .footer { display: block; }
      .footer span + span { display: block; margin-top: 5px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --ink: #eef2fb; --muted: #a5afc2; --line: #303a50; --surface: rgba(27, 34, 51, .9); --blue-soft: #202e5b; }
      body { background: radial-gradient(circle at 12% 0%, #19284b 0, transparent 35%), #111624; }
      .card { border-color: #ffffff12; box-shadow: 0 24px 70px #0005; }
      .fields, .icon-button, .copy-button { border-color: var(--line); background: #1d2538; }
      .item-icon { color: #b9c8ff; background: #24345f; }
      .empty-icon { background: #422b35; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand" aria-label="Password Entry">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 10.7V8.4a4.8 4.8 0 0 1 9.6 0v2.3"/><rect x="4.5" y="10.4" width="15" height="10.2" rx="2.6"/><path d="M12 14.2v2.7"/></svg>
      </div>
      <div><div class="brand-name">Password Entry</div><div class="brand-caption">安全分享凭据</div></div>
    </header>

    <section id="card" class="card" aria-live="polite">
      <div id="loading" class="empty">
        <div class="empty-icon" style="color:#3b63d8;background:#eef3ff" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v4M12 17v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M3 12h4M17 12h4M4.2 19.8 7 17M17 7l2.8-2.8"/></svg></div>
        <h1>正在读取分享内容</h1><p>正在安全地获取加密副本。</p>
      </div>
      <div id="content" hidden>
        <div class="card-head">
          <div class="eyebrow"><span>SECURE SHARE</span><span class="status">链接有效</span></div>
          <div class="item"><div id="itemIcon" class="item-icon" aria-hidden="true">P</div><div><h1 id="itemName" class="item-name"></h1><p id="itemDomain" class="item-domain"></p></div></div>
        </div>
        <div class="body">
          <div class="section-label">登录信息</div>
          <div id="fields" class="fields"></div>
          <div class="footer"><span>请只在可信设备上查看和复制。</span><span>由 <strong>Password Entry</strong> 安全分享</span></div>
        </div>
      </div>
      <div id="error" class="empty" hidden>
        <div class="empty-icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v5M12 17.2v.1"/><circle cx="12" cy="12" r="8.7"/></svg></div>
        <h1 id="errorTitle">无法打开分享</h1><p id="errorMessage"></p>
      </div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const icons = { copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>', eye: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.4-5 9.5-5 9.5 5 9.5 5-3.4 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.3"/></svg>' };
    const decode = (value) => {
      const normalized = value.replaceAll('-', '+').replaceAll('_', '/').padEnd(Math.ceil(value.length / 4) * 4, '=');
      const bytes = atob(normalized);
      return Uint8Array.from(bytes, (character) => character.charCodeAt(0));
    };
    const base32Alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    function decodeBase32(value) {
      const normalized = String(value || '').replace(/[=\s]/g, '').toUpperCase();
      if (!normalized) throw new Error('TOTP 配置无效');
      let buffer = 0; let bits = 0; const output = [];
      for (const character of normalized) {
        const index = base32Alphabet.indexOf(character);
        if (index < 0) throw new Error('TOTP 配置无效');
        buffer = (buffer << 5) | index; bits += 5;
        if (bits >= 8) { bits -= 8; output.push((buffer >> bits) & 0xff); buffer &= (1 << bits) - 1; }
      }
      if (!output.length) throw new Error('TOTP 配置无效');
      return new Uint8Array(output);
    }
    async function generateTotp(config, timestamp = Date.now()) {
      const period = Number.isInteger(Number(config?.period)) && Number(config.period) > 0 ? Number(config.period) : 30;
      const digits = [6, 8].includes(Number(config?.digits)) ? Number(config.digits) : 6;
      const algorithm = String(config?.algorithm || 'SHA1').toUpperCase();
      if (!['SHA1', 'SHA256', 'SHA512'].includes(algorithm)) throw new Error('TOTP 配置无效');
      const counter = Math.floor(timestamp / 1000 / period);
      const message = new ArrayBuffer(8); const view = new DataView(message);
      view.setUint32(0, Math.floor(counter / 0x100000000)); view.setUint32(4, counter >>> 0);
      const hashName = {SHA1: 'SHA-1', SHA256: 'SHA-256', SHA512: 'SHA-512'}[algorithm];
      const key = await crypto.subtle.importKey('raw', decodeBase32(config.secret), {name: 'HMAC', hash: {name: hashName}}, false, ['sign']);
      const digest = new Uint8Array(await crypto.subtle.sign('HMAC', key, message));
      const offset = digest[digest.length - 1] & 0x0f;
      const binary = ((digest[offset] & 0x7f) << 24) | (digest[offset + 1] << 16) | (digest[offset + 2] << 8) | digest[offset + 3];
      return {code: String(binary % (10 ** digits)).padStart(digits, '0'), period, counter};
    }
    async function copyValue(value, button) {
      let copied = false;
      try { await navigator.clipboard.writeText(value); copied = true; }
      catch {
        try { const area = document.createElement('textarea'); area.value = value; document.body.append(area); area.select(); copied = document.execCommand('copy'); area.remove(); }
        catch { copied = false; }
      }
      const original = button.innerHTML;
      button.textContent = copied ? '已复制' : '复制失败';
      setTimeout(() => { button.innerHTML = original; }, 1400);
    }
    function field(label, value, {secret = false} = {}) {
      const row = document.createElement('div'); row.className = 'field';
      const name = document.createElement('span'); name.className = 'field-label'; name.textContent = label;
      const main = document.createElement('div'); main.className = 'field-main';
      const output = document.createElement('span'); output.className = 'field-value' + (secret ? ' secret' : ''); output.textContent = secret ? '••••••••••••' : (value || '—');
      main.append(output);
      const actions = document.createElement('div'); actions.className = 'field-actions';
      if (secret) {
        const reveal = document.createElement('button'); reveal.className = 'icon-button'; reveal.type = 'button'; reveal.title = '显示密码'; reveal.setAttribute('aria-label', '显示密码'); reveal.innerHTML = icons.eye;
        let shown = false; reveal.addEventListener('click', () => { shown = !shown; output.textContent = shown ? value : '••••••••••••'; reveal.title = shown ? '隐藏密码' : '显示密码'; reveal.setAttribute('aria-label', reveal.title); }); actions.append(reveal);
      }
      const copy = document.createElement('button'); copy.className = 'copy-button'; copy.type = 'button'; copy.innerHTML = icons.copy + '<span>复制</span>'; copy.addEventListener('click', () => copyValue(value, copy)); actions.append(copy);
      row.append(name, main, actions); return row;
    }
    function totpField(config) {
      const row = document.createElement('div'); row.className = 'field';
      const name = document.createElement('span'); name.className = 'field-label'; name.textContent = 'TOTP';
      const main = document.createElement('div'); main.className = 'field-main';
      const output = document.createElement('span'); output.className = 'field-value totp-code'; output.textContent = '------';
      const meta = document.createElement('span'); meta.className = 'field-meta'; meta.textContent = '正在生成验证码…';
      main.append(output, meta);
      const actions = document.createElement('div'); actions.className = 'field-actions';
      const copy = document.createElement('button'); copy.className = 'copy-button'; copy.type = 'button'; copy.disabled = true; copy.innerHTML = icons.copy + '<span>复制</span>';
      let currentCode = ''; let currentCounter = -1; let updateInFlight = false;
      copy.addEventListener('click', () => { if (currentCode) copyValue(currentCode, copy); });
      actions.append(copy); row.append(name, main, actions);
      const update = async () => {
        if (updateInFlight) return;
        updateInFlight = true;
        try {
          const now = Date.now(); const result = await generateTotp(config, now);
          const remaining = result.period - (Math.floor(now / 1000) % result.period);
          if (result.counter !== currentCounter) { currentCode = result.code; currentCounter = result.counter; output.textContent = result.code; copy.disabled = false; }
          meta.textContent = `有效期剩余 ${remaining} 秒`;
        } catch { output.textContent = '不可用'; meta.textContent = 'TOTP 配置无效'; copy.disabled = true; }
        finally { updateInFlight = false; }
      };
      update(); window.setInterval(update, 1000); return row;
    }
    async function load() {
      const shareId = location.pathname.split('/').filter(Boolean).pop();
      const secret = location.hash.slice(1);
      history.replaceState(null, '', location.pathname);
      if (!shareId || !secret) throw new Error('分享链接已失效或者过期。');
      const response = await fetch('/v1/shares/' + encodeURIComponent(shareId), {cache: 'no-store'});
      if (!response.ok) throw new Error(response.status === 410 ? '分享链接已失效或者过期。' : '分享链接不存在或暂时无法访问。');
      const envelope = await response.json();
      const key = await crypto.subtle.importKey('raw', decode(secret), {name: 'AES-GCM'}, false, ['decrypt']);
      const aad = new TextEncoder().encode('password-entry-share:v1:' + shareId);
      const clear = await crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(envelope.iv), additionalData: aad, tagLength: 128}, key, decode(envelope.ciphertext));
      const payload = JSON.parse(new TextDecoder().decode(clear));
      $('itemIcon').textContent = (payload.name || 'P').trim().slice(0, 1).toUpperCase();
      $('itemName').textContent = payload.name || '未命名登录项';
      $('itemDomain').textContent = (payload.domains || []).join(' · ') || '未提供网站';
      $('fields').append(field('用户名', payload.username), field('密码', payload.password, {secret: true}));
      if (payload.totp) $('fields').append(totpField(payload.totp));
      $('loading').hidden = true; $('content').hidden = false;
    }
    load().catch((error) => { $('loading').hidden = true; $('errorTitle').textContent = '无法打开分享'; $('errorMessage').textContent = error.message || '无法读取分享内容。'; $('error').hidden = false; });
  </script>
</body>
</html>
