<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Password Entry 设置</title></head>
<body style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:48px auto;padding:0 24px"><h1>Password Entry</h1><p>桌面端负责保存和解锁保险库，Chrome 扩展通过 Native Messaging 协助网页填充。</p><h2>安装</h2><ol><li>运行 <code>./scripts/build-macos.sh</code> 并打开 <code>dist/Password Entry.app</code>。</li><li>在 <code>chrome://extensions</code> 加载本项目目录。</li><li>复制扩展 ID 后运行 <code>./native-host/install.sh YOUR_EXTENSION_ID</code>。</li></ol></body></html>
