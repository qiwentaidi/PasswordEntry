<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Entry Test Form</title>
</head>
<body>
  <h1>Local Password Entry Test</h1>
  <form id="login" onsubmit="event.preventDefault()">
    <label>Username <input name="username" autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password"></label>
    <label>Authenticator code <input name="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit verification code"></label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
